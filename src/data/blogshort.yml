    title: Debugging C++ code in R with a single command
    description: There are several great references for how to debug C or C++ code in R, but descriptions of how to start a debugger are often not so informative. This post describes how to start a debugging session in R with a single command.
    created: 30 Aug 22
    tags: code
    link: blog/r-cpp-debugging.html
