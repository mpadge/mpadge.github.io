    title: "Machina machista"
    description: Your AI thinks you're a dude. And that's a big problem for everybody who is not. Matching LLMs with decision-making scenarios shows escalatory recommendations are around 10&#215; more likely when actors are identified as male rather than female. And default behaviour in the absence of gender specifiers is overwhelmingly "male". The more such models inform real decisions, the greater the risk of building genuine <em>machina machista</em> — machines whose ordinary use normalises misogynistic and macho behaviour throughout society.
    created: 22 Jul 26
    tags: code, ai
    link: blog/machina-machista.html
