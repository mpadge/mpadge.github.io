    title: "Purposeful joy"
    description: The current purpose for a select few is to help computer programs replace the purposeful labour of a generation of uniquely idiosyncratic human beings. Yet the relationship of those being replaced to their own intrinsic purpose is categorically indistinguishable to that of those people doing the replacing. The end point of any logic of AI-replaceability is hierarchical collapse, the auto-CEO, and economic death. The saving grace is that, unlike purpose, joy steadfastly resists hierarchical direction. And that makes joy arguably one of the most important non-capturable resources left.
    created: 09 Jun 26
    mastodon: https://nerdculture.de/@mpadge/116720930983640959
    tags: code, ai
    link: blog/purposeful-joy.html
